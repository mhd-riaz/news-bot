# Model files that are kept out of git. `make models` (scripts/download_models.py)
# downloads each one into this ml/ folder and checks every file's SHA-256.
#
# Each [[model]] is one archive. `unpack_to` is relative to ml/. `sha256` and `size`
# describe the archive; [model.files] lists the SHA-256 of every file inside it.
# A source is either a plain https `url` or a GitHub release (github_repo, tag, asset).
# The archives below are in the owner's public Google Drive folder, so anyone can
# download them without signing in:
# https://drive.google.com/drive/folders/1UStIvlI6xOwMvuEI0i5VMD0vWIDoYoiU
# A backup copy of each one is a release of the same name in the private repository
# mhd-riaz/news-bot-archive.

[[model]]
name = "classifier-v4-ai-072b01a9ceaf"
about = "Production topic classifier v4-ai-072b01a9ceaf-hybrid_svc (roadmap D19)"
unpack_to = "models/classifier/v4-ai-072b01a9ceaf"
sha256 = "a761086d2d4fa8013613c5036a1dbfb18d8dfb903d7de8f4ba7e7ee0e036ac73"
size = 44485486

[model.source]
# The Drive file classifier-v4-ai-072b01a9ceaf.tar.gz. `confirm=t` skips the virus-scan
# warning page that Drive shows instead of large files.
url = "https://drive.usercontent.google.com/download?id=15R0MFD_TgVwvQCpy9Mi_IEQQeq1hUtq_&export=download&confirm=t"

[model.files]
# bundle.joblib's hash is the value production checks as NEWSML_MODEL_SHA256.
"bundle.joblib" = "61cbaa89016d1acd88473cad2cf59cec69e74177aabe123bafa0a9c9f6c22fde"
"manifest.json" = "391eb9c06cee88f5fe8c616bf48fbbba025aecedacbb81c14b310d54d07eb6dd"
"model-card.md" = "d2dc73021dacede138f05faa8b373009cdf0b5bde4cf2d2578cc4af5796e357f"
