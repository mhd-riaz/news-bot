# Model files that are kept out of git. `make models` (scripts/download_models.py)
# downloads each one into this ml/ folder and checks every file's SHA-256.
#
# Each [[model]] is one archive. `unpack_to` is relative to ml/. `sha256` and `size`
# describe the archive; [model.files] lists the SHA-256 of every file inside it.
# A source is either a GitHub release (github_repo, tag, asset) or a plain https `url`.
# The releases below are in the private repository mhd-riaz/news-bot-archive, so you
# need read access to it: sign in with `gh auth login`, or set GITHUB_TOKEN.

[[model]]
name = "classifier-v4-ai-072b01a9ceaf"
about = "Production topic classifier v4-ai-072b01a9ceaf-hybrid_svc (roadmap D19)"
