# Canonical topic taxonomy. One topical axis only: geography is a separate
# field, not a class, because `categories` interleaves the two and a classifier
# trained on the mixture learns "where" rather than "what".
#
# The descriptions below are the single source of truth for the human labelling
# guide, which is generated from them. One definition means every annotator is
# answering the same question, which is what makes their agreement measurable.
#
# FIXED, FLAT, ONE LEVEL. These 13 classes are the IPTC Media Topics top level —
# the standard the wire agencies tag against, and the same set of sections you
# would find on the nav bar of any major international newspaper (World/Politics,
# Business, Technology, Science, Health, Sports, Entertainment, and so on). There
# is no finer child level any more, by decision: v3 explored a 26-class, two-level
# hierarchy for several rounds, and the evidence it produced is exactly what
# closed the question rather than opening more of them —
#   - "granularity myth busted": splitting cost nothing at the group level
#     (rolling up a fine-grained model beat one trained on groups directly), so
#     resolution alone was never the argument for going finer;
#   - but four of the fine classes (business_companies, labour_work,
#     lifestyle_living, society_community) failed on BOTH sides at once — the
#     retrieval sampler could not find them and the classifier could not predict
#     them — which means they were never linguistically distinct from their
#     siblings, no matter how much more they were labelled;
#   - and every top confusion the fine model made was within one of these 13
#     families in the first place (elections/government/protest, diplomacy/
#     conflict), i.e. the finer distinction the annotators were being asked to
#     make was usually not recoverable from the text either.
# So rather than keep relabelling towards a boundary that was not there, the
# taxonomy is fixed at the level that was already carrying the real signal.
#
# Bump `version` on any change to the class list or the definitions. Labels
# record the version they were assigned under, so a taxonomy change invalidates
# the affected labels instead of silently reinterpreting them. v3 -> v4's change
# is a lossless rollup (every v3 child is a subset of its v3 parent, which is
# this class), so existing gold labels were mechanically migrated rather than
# relabelled by hand — see data/labels/*.v3-child-level.jsonl.bak for the
# pre-migration originals.

version: 4
unsorted: unsorted

classes:
  - id: politics
    iptc: politics
    description: >-
      Government, elections, diplomacy, campaigns, protest and activism, and
      public administration — legislation, ministries, budgets, regulation,
      candidates, polling, foreign relations, treaties, state visits, and
      demonstrations or civil dissent are all one class.
    excludes: A crime prosecuted in court, which is crime_justice. Armed conflict, which is conflict_war.

  - id: crime_justice
    iptc: crime, law and justice
    description: >-
      Crime, policing and the legal system — criminal acts, investigations,
      arrests and fraud reported as an offence, plus trials, verdicts,
      sentencing and the judiciary as an institution.
    excludes: Legislation being debated, which is politics.

  - id: business_economy
    iptc: economy, business and finance
    description: >-
      Companies, markets and the economy — corporate results, mergers,
      executives, layoffs and strategy; stocks, currencies, commodities, bonds,
      investing and public offerings; GDP, inflation, employment, trade,
      taxation and central banks.
    excludes: A tech company's product launch, which is technology.

  - id: technology
    iptc: science and technology
    description: >-
      Computing, the internet, devices and the technology industry —
      artificial intelligence and machine learning; cybersecurity, breaches and
      privacy; consumer gadgets, apps and product launches; and technology
      companies as businesses, startups, chips and platforms.
    excludes: Government regulation of tech, which is politics. Research findings, which is science_space.

  - id: science_space
    iptc: science and technology
    description: >-
      Scientific research and spaceflight — physics, biology, chemistry,
      archaeology, palaeontology and discovery, plus astronomy, space
      missions, satellites and rockets.
    excludes: Medical and public-health research, which is health.

  - id: entertainment_arts
    iptc: arts, culture, entertainment and media
    description: >-
      Entertainment, the arts and cultural life — film, television, streaming,
      music, celebrity and the media industry, plus books, visual art,
      theatre, dance, design and heritage.

  - id: society_lifestyle
    iptc: society, human interest, labour, religion, lifestyle and leisure
    description: >-
      Society, work and daily life — human interest, religion, festivals,
      migration, communities and social issues; unions, strikes, wages,
      hiring and workplace rights; travel, food, fashion, relationships,
      wellbeing, homes and hobbies.

  - id: health
    iptc: health
    description: >-
      Medicine, disease, public health, hospitals, mental health, nutrition
      and drugs.
    excludes: Health insurance markets, which is business_economy.

  - id: education
    iptc: education
    description: >-
      Schools, universities, exams, admissions, curriculum, teachers and
      students.

  - id: environment_climate
    iptc: environment
    description: >-
      Climate change, pollution, conservation, wildlife, the energy transition
      and natural resources.
    excludes: A natural disaster as it happens, which is disaster_accident.

  - id: disaster_accident
    iptc: disaster, accident and emergency incident
    description: >-
      Earthquakes, floods, storms, fires, industrial and transport accidents,
      and the emergency response to them.
    excludes: The long-run climate context, which is environment_climate.

  - id: conflict_war
    iptc: conflict, war and peace
    description: >-
      Armed conflict, military operations, terrorism, insurgency, peace talks
      and their humanitarian consequences.
    excludes: Defence procurement debated in parliament, which is politics.

  - id: sport
    iptc: sport
    description: >-
      Matches, tournaments, players, teams, transfers, doping and the bodies
      that govern sport.

# Section feeds, keyed by the source name in configs/sources.yaml. Every URL
# behind these names contains the section, so the topic is a property of the
# feed rather than a guess about the article: everything on
# theguardian.com/sport/rss is sport. These are trusted on their own.
#
# World and International sections are deliberately absent. A world desk files
# whatever happened abroad, so those sections name a *place*, not a topic — the
# same confusion that keeps geography out of the class list.
#
# Renaming a source in sources.yaml silently drops its label. Asserted by
# test_every_feed_topic_names_a_configured_source.
feed_topics:
  The Hindu — Business: business_economy
  The Hindu — Sport: sport
  The Hindu — Entertainment: entertainment_arts
  The Hindu — Education: education
  The Hindu — Life and Style: society_lifestyle
  The Indian Express — Business: business_economy
  The Indian Express — Sports: sport
  The Indian Express — Entertainment: entertainment_arts
  The Indian Express — Health: health
  The Indian Express — Education: education
  The Indian Express — Technology: technology
  Hindustan Times — Sports: sport
  Hindustan Times — Cricket: sport
  Hindustan Times — Entertainment: entertainment_arts
  Livemint — Markets: business_economy
  Livemint — Companies: business_economy
  Livemint — Industry: business_economy
  Livemint — Money: business_economy
  Livemint — Politics: politics
  Livemint — Technology: technology
  Livemint — Sports: sport
  Livemint — Education: education
  NDTV — Cricket: sport
  NDTV — Movies: entertainment_arts
  The Guardian — Business: business_economy
  The Guardian — Sport: sport
  The Guardian — Culture: entertainment_arts
  The Guardian — Film: entertainment_arts
  The Guardian — Music: entertainment_arts
  The Guardian — Science: science_space
