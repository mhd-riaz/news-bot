# The topic a publisher mostly covers. This is a prior, NOT a fact: measured
# against the 150-article pilot gold set it named the wrong group 42% of the
# time, because a general-interest tech outlet also covers courts, culture and
# space. "TikTok reaches $400M privacy settlement" arrived on Wired's feed and
# is crime_justice. Never trusted on its own.
publisher_topics:
  Wired: technology
  The Register: technology
  Engadget: technology
  Ars Technica: technology
  TechCrunch: technology
  The Verge: technology
  MIT Technology Review: technology
  ZDNET: technology
  ScienceDaily: science_space
  Phys.org: science_space
  Nature: science_space
  Quanta Magazine: science_space
  New Scientist: science_space
  NASA — Breaking News: science_space
  Moneycontrol: business_economy
  Business Standard: business_economy
  The Economic Times: business_economy
  MarketWatch: business_economy
  CNBC: business_economy
  WHO — News: health
  The Lancet: health
  Nature Medicine: health
  NOAA — News: environment_climate
  UNEP — News and Stories: environment_climate
  Bank for International Settlements — Press: business_economy

# RSS `categories` values that map cleanly onto a class. Publishers fragment
# their own vocabulary, so several strings collapse to one class.
