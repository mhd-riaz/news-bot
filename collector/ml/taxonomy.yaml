# Values that describe placement, format or commerce rather than subject. An
# opinion piece about cricket is still sport, so format never becomes a label.
# Affiliate content is not news at all and should not reach the classifier.
non_topical:
  - analysis
  - cities
  - coupons
  - deals
  - editorial
  - exclusive
  - features
  - gear / deals
  - interview
  - latest news
  - news
  - obituaries
  - opinion
  - specials
  - states
  - top stories
