  # ---------------------------------------------------------------------------
  # Section feeds
  #
  # Every URL below names a section, which makes the topic a property of the
  # feed rather than a guess about the article. That is the whole point: the
  # 150-article pilot measured publisher-level topic priors at 58% group
  # agreement with human labels, because a general-interest outlet also covers
  # courts, culture and space. A section feed does not have that problem.
  #
  # `ml/taxonomy.yaml` maps these source names to classes under `feed_topics`,
  # so the name here is load-bearing — renaming one silently drops its label.
  #
  # Every URL was verified to resolve and return items before being added.
  # Sections that 404'd or returned HTML are recorded at the bottom of this file
  # so nobody rediscovers them.
  #
  # Weighted towards the classes the pilot found starved: education 0.7%,
  # health 1.3%, environment 1.3%, entertainment 3.3%, sport 3.3%.
  # ---------------------------------------------------------------------------

