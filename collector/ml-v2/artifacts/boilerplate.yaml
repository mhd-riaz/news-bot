  Livemint — Sports:
  - line: About the Author
    docs: 61
    fraction: 0.635
  - line: While he possesses a versatile command over all sports, he finds his niche
      in cricket, specializing in breaking news, long-form interviews, global sporting
      updates, and high-energy live blogs. Koushik's professional perspective was
      further sharpened through the 2020 AIPS Young Reporters Programme, where he
      gained invaluable insights from renowned international journalists, including
      Keir Radnedge and Riccardo Romani from the United Kingdom, and Martin Mazur
      from Argentina. Currently based between Kolkata and Delhi, Koushik remains at
      the forefront of the breaking developments that shape the public sporting discourse.
      When he isn't tracking scores or deconstructing plays, he can be found exploring
      new landscapes on his travels or channeling his creative energy into the kitchen.
    docs: 35
    fraction: 0.365
  - line: If you have a compelling story to share or know an individual who deserves
      the spotlight, please reach out via email at koushik.paul@htdigital.in.
    docs: 32
    fraction: 0.333
  - line: Koushik Paul
    docs: 32
    fraction: 0.333
  - line: Koushik lives and breathes sports. After transitioning from his own aspirations
      of becoming a professional athlete, he successfully channeled that lifelong
      passion into a prolific career, documenting the action both from the sidelines
      and the editorial desk. With over eight years of industry experience, Koushik
      joined LiveMint as a Deputy Chief Content Producer in 2024, following impactful
      stints at Outlook India, India.com, Sportskeeda, Women's CricZone, and OrissaPOST.
      A 2017 Journalism and Mass Communication graduate from Maharaja Manindra Chandra
      College, Kolkata, Koushik has reported on high-profile events including the
      FIFA U17 World Cup 2017, Ranji Trophy, FIH Pro League, FIH World League finals,
      the Indian Premier League, and Lionel Messi's historic visit to Kolkata in 2025.
    docs: 32
    fraction: 0.333
  - line: Over the years, he has reported extensively on marquee sporting events such
      as the Indian Premier League (IPL) and the Indian Super League (ISL). His reporting
      has also provided opportunities to interact with some of the game's leading
      personalities, including India cricketers Yuzvendra Chahal and Dhruv Jurel.
    docs: 21
    fraction: 0.219
  - line: Vishnu pursued a Post Graduate Diploma in Journalism from the Asian College
      of Journalism (ACJ), Chennai, in 2016 and graduated in 2017. Since then, he
      has built an extensive career in sports journalism, working with leading media
      organisations including Deccan Chronicle and Firstpost. In 2025, he worked for
      CricXtasy for six months before joining LiveMint in February 2026.
    docs: 21
    fraction: 0.219
  - line: Away from the newsroom, Vishnu enjoys unwinding with books, discovering
      new music and binge-watching television series.
