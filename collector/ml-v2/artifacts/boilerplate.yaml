  - line: PN Vishnu
    docs: 16
    fraction: 0.167
  - line: PN Vishnu is a contributor with the LiveMint Sports team, where he primarily
      covers cricket, football and other major sporting events. A passionate sports
      journalist with nearly a decade of experience in digital media, Vishnu has been
      an ardent follower of sports for more than 10 years. While he enjoys covering
      a wide range of disciplines, his biggest sporting passions remain cricket and
      football. He is also a devoted supporter of Royal Challengers Bengaluru in the
      Indian Premier League and Manchester United in English football.
    docs: 16
    fraction: 0.167
  - line: Aachal has conducted and produced exclusive interviews with athletes and
      public figures such as India cricketer Dhruv Jurel, Indian women's hockey captain
      Savita Punia, and industrialist Ratan Tata, along with several emerging and
      established sports personalities. Her body of work includes in-depth explainers,
      athlete profiles, emotionally resonant fan narratives, and data-backed match
      analysis across cricket, Olympic sports, and international competitions.
    docs: 15
