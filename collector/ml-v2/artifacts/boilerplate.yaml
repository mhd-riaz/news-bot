  - line: At LiveMint, Dhanya consistently writes and produces articles that make
      complex financial topics accessible to readers. She keeps a close eye on equity
      markets, commodities, and macroeconomic indicators, assisting audiences in comprehending
      how global and domestic events influence investment perspectives. Her stories
      frequently underscore emerging trends within sectors, the IPO market, company
      earnings results, and market strategies pertinent to both retail and institutional
      investors.
    docs: 34
