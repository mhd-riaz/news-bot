<!doctype html>
<!--
  What a publisher serves when a feed URL has quietly become a redirect to a
  landing page. It is valid markup and returns 200, so only the parser can tell
  it is not a feed.
-->
<html lang="en">
  <head>
    <title>Feed moved</title>
  </head>
  <body>
    <h1>This feed is no longer available</h1>
    <p>Please subscribe to the newsletter instead.</p>
  </body>
</html>
