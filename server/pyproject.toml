[project]
name = "newsbot-server"
version = "0.1.0"
description = "AFTERLINE reader API with Google sign-in, and a separate read-only MCP program."
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Rule 9: each dependency has a reason. Flask, gunicorn and pymongo are already
# used by the ranker in ml-v2; mcp is the new one (D21, C11). uvicorn, starlette and
# pydantic are installed by mcp anyway; they are listed because the MCP program
# imports them directly.
dependencies = [
    "flask>=3.1.3,<4",       # web routes, cookies and JSON responses
    "gunicorn>=23.0.0,<24",  # production WSGI server for the web app
    "pymongo>=4.20.1,<5",    # MongoDB reads, readers and reader_sessions
    "mcp>=2.3.0,<3",         # official MCP Python SDK for the read-only MCP program
    "uvicorn>=0.54.0,<1",    # serves the MCP HTTP app wrapped in the agent-key check
    "starlette>=1.10.0,<2",  # MCP health routes (the SDK's own web framework)
    "pydantic>=2.14.4,<3",   # MCP tool argument limits (Field), as in the SDK docs
]

[project.scripts]
newsbot-server = "newsbot_server.web.cli:main"
newsbot-mcp = "newsbot_server.mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsbot_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
markers = [
    "integration: needs MongoDB (NEWS_TEST_MONGO_URI, default localhost:27017); uses throwaway news_it_* databases",
]
